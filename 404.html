<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Kerala Chakkala Service Society</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;700;900&display=swap');

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #111 0%, #000 100%);
            color: #ffffff;
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.8;
        }

        .content {
            position: relative;
            z-index: 2;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            animation: float-content 6s ease-in-out infinite;
        }

        @keyframes float-content {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        h1 {
            font-size: clamp(6rem, 15vw, 12rem);
            margin: 0;
            font-weight: 900;
            background: linear-gradient(135deg, #fff 0%, #a5b4fc 50%, #6366f1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
            line-height: 1;
            letter-spacing: -2px;
        }

        p {
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            margin: 0;
            color: #94a3b8;
            font-weight: 300;
            max-width: 600px;
            padding: 0 1rem;
        }

        .home-btn {
            margin-top: 1rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 1rem 2.5rem;
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: auto;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            overflow: hidden;
            position: relative;
        }

        .home-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0) 0%, rgba(99, 102, 241, 0.2) 100%);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .home-btn:hover {
            border-color: rgba(99, 102, 241, 0.5);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.3);
            transform: translateY(-3px) scale(1.02);
        }

        .home-btn:hover::before {
            opacity: 1;
        }
    </style>
</head>

<body>
    <canvas id="canvas-container"></canvas>

    <div class="content">
        <h1>404</h1>
        <p>Page Not Found / Site Under Maintenance</p>
        <a href="./" class="home-btn">Return to Homepage</a>
    </div>

    <script>
        const canvas = document.getElementById('canvas-container');
        const ctx = canvas.getContext('2d');

        let width, height;
        let particles = [];

        let mouse = {
            x: null,
            y: null,
            radius: 150
        }

        window.addEventListener('mousemove', function (event) {
            mouse.x = event.x;
            mouse.y = event.y;
        });

        window.addEventListener('mouseleave', function () {
            mouse.x = undefined;
            mouse.y = undefined;
        });

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.size = Math.random() * 3 + 0.5;
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.weight = (Math.random() * 0.5) + 0.1;
                this.angle = Math.random() * Math.PI * 2;
                this.spinSpeed = (Math.random() - 0.5) * 0.05;

                // Colors ranging from subtle white to blue/purple hues
                const colors = [
                    'rgba(255, 255, 255, 0.3)',
                    'rgba(165, 180, 252, 0.4)',
                    'rgba(99, 102, 241, 0.2)'
                ];
                this.color = colors[Math.floor(Math.random() * colors.length)];

                // Determine shape
                this.shapeType = Math.random() > 0.5 ? 'triangle' : 'square';
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                ctx.fillStyle = this.color;

                ctx.beginPath();
                if (this.shapeType === 'triangle') {
                    // Triangle debris
                    ctx.moveTo(0, -this.size);
                    ctx.lineTo(this.size, this.size);
                    ctx.lineTo(-this.size, this.size);
                } else {
                    // Square debris
                    ctx.rect(-this.size / 2, -this.size / 2, this.size, this.size);
                }
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            }

            update() {
                this.angle += this.spinSpeed;

                // Drift upwards
                this.y -= this.weight;

                // Slight horizontal drift
                this.x += Math.sin(this.angle) * 0.2;

                if (this.y < -50) {
                    this.y = height + 50;
                    this.x = Math.random() * width;
                }

                // Mouse repel interaction
                if (mouse.x != null) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < mouse.radius) {
                        let forceDirectionX = dx / distance;
                        let forceDirectionY = dy / distance;

                        let force = (mouse.radius - distance) / mouse.radius;

                        let directionX = (forceDirectionX * force * 5) * -1;
                        let directionY = (forceDirectionY * force * 5) * -1;

                        this.x += directionX;
                        this.y += directionY;
                    }
                }
            }
        }

        function init() {
            particles = [];
            // Calculate particle count based on screen size, cap it for performance
            let numberOfParticles = Math.min((canvas.width * canvas.height) / 9000, 200);

            for (let i = 0; i < numberOfParticles; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }
            requestAnimationFrame(animate);
        }

        init();
        animate();
    </script>
</body>

</html>
